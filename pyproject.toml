[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "Annotation-Based AI Agent Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jongyeon Keum" }]

dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "networkx>=3.3",
    "anyio>=4.0",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
viz    = ["graphviz>=0.20"]
openai = ["openai>=1.50"]
google = ["google-genai>=1.0"]
mcp    = ["mcp>=1.0"]
docs   = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]
examples = [
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
]
all = ["graphviz>=0.20", "openai>=1.50", "google-genai>=1.0", "mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
]

[project.urls]
Homepage = "https://github.com/JY-1019/FlowForge"
Repository = "https://github.com/JY-1019/FlowForge"
Issues = "https://github.com/JY-1019/FlowForge/issues"

[project.scripts]
flowforge = "flowforge.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["flowforge*"]

[tool.setuptools.package-data]
flowforge = [
    "mkdocs.yml",
    "_docs/**/*.md",
    "_docs/**/*.yml",
    "_docs/**/*.yaml",
    "_docs/**/*.png",
    "_docs/**/*.svg",
    "_docs/**/*.css",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
