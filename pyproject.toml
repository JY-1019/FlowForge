[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.1"
description = "Annotation-Based AI Agent Framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jongyeon Keum" }]
maintainers = [{ name = "Jongyeon Keum" }]
keywords = [
    "agents",
    "ai",
    "annotations",
    "asyncio",
    "dag",
    "decorators",
    "llm",
    "mcp",
    "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "networkx>=3.3",
    "anyio>=4.0",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
viz = ["graphviz>=0.20"]
openai = ["openai>=1.50"]
google = [
    "google-genai>=1.0",
    "google-generativeai>=0.8",
]
mcp = ["mcp>=1.0"]
otel = ["opentelemetry-api>=1.20"]
pandoc = ["pypandoc-binary>=1.13"]
artifacts = [
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pypandoc-binary>=1.13",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]
examples = [
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pypandoc-binary>=1.13",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
]
all = [
    "graphviz>=0.20",
    "openai>=1.50",
    "google-genai>=1.0",
    "google-generativeai>=0.8",
    "mcp>=1.0",
    "opentelemetry-api>=1.20",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pypandoc-binary>=1.13",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
]
dev = [
    "build>=1.2",
    "check-manifest>=0.49",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "twine>=5.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pypandoc-binary>=1.13",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/JY-1019/FlowForge"
Repository = "https://github.com/JY-1019/FlowForge"
Issues = "https://github.com/JY-1019/FlowForge/issues"

[project.scripts]
flowforge = "flowforge.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["flowforge*"]

[tool.setuptools.package-data]
flowforge = [
    "py.typed",
    "mkdocs.yml",
    "_docs/**/*.md",
    "_docs/**/*.yml",
    "_docs/**/*.yaml",
    "_docs/**/*.png",
    "_docs/**/*.svg",
    "_docs/**/*.css",
    "skills/anthropic/*/SKILL.md",
    "skills/anthropic/*/LICENSE.txt",
    "skills/anthropic/*/assets/**/*",
    "skills/anthropic/*/references/**/*",
    "skills/anthropic/*/scripts/**/*",
    "skills/native/*/SKILL.md",
    "skills/native/*/assets/**/*",
    "skills/native/*/references/**/*",
    "skills/native/*/scripts/**/*",
    "tools/_ppt_master/LICENSE",
    "tools/_ppt_master/TECHNICAL_DESIGN.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
